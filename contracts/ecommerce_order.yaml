version: "1.0.0"
dataset: "ecommerce_order"
grain: "one product line item within one customer order"
description: "Data Contract and Quality Boundary Rules for GlobalCart Medallion Lakehouse"

columns:
  Order_ID:
    type: "string"
    nullable: false
    description: "Business order identifier (Degenerate Dimension)"
  Order_Date:
    type: "date"
    nullable: false
    format: "yyyy-MM-dd"
    description: "Transaction placement date"
  Customer_ID:
    type: "string"
    nullable: false
    description: "Natural identifier for Customer dimension"
  Customer_Gender:
    type: "string"
    nullable: true
    description: "Demographic attribute for customer"
  Customer_Segment:
    type: "string"
    nullable: true
    description: "Segment attribute (Consumer, Corporate, Home Office)"
  Product_Name:
    type: "string"
    nullable: false
    description: "Product natural identifier"
  Category:
    type: "string"
    nullable: false
    description: "High-level merchandise category"
  Sub_Category:
    type: "string"
    nullable: true
    description: "Merchandise subcategory"
  Quantity:
    type: "integer"
    nullable: false
    min: 1
    description: "Item count ordered; must be strictly positive"
  Unit_Price:
    type: "double"
    nullable: false
    min: 0.0
    description: "Base catalog price per unit"
  Discount:
    type: "double"
    nullable: false
    min: 0.0
    max: 1.0
    description: "Discount applied to line item in range [0.0, 1.0]"
  Revenue:
    type: "double"
    nullable: false
    min: 0.0
    description: "Line item total revenue post-discount"
  Cost:
    type: "double"
    nullable: false
    min: 0.0
    description: "Cost of goods sold for line item"
  Profit:
    type: "double"
    nullable: false
    description: "Gross margin / profit generated by line item"
  Shipping_Cost:
    type: "double"
    nullable: false
    min: 0.0
    description: "Shipping and logistics fulfillment fee"
  Shipping_Days:
    type: "integer"
    nullable: false
    min: 0
    description: "Delivery elapsed duration in business days"
  Order_Status:
    type: "string"
    nullable: false
    allowed_values:
      - "Delivered"
      - "Returned"
      - "Cancelled"
      - "Processing"
      - "Shipped"
    description: "Fulfillment life-cycle state"
  Payment_Method:
    type: "string"
    nullable: true
    description: "Customer tender method"
  Shipping_Method:
    type: "string"
    nullable: true
    description: "Logistics carrier service level"
  Region:
    type: "string"
    nullable: true
    description: "Macro sales territory"
  Country:
    type: "string"
    nullable: true
    description: "Destination country"

metadata_columns:
  _ingested_at:
    type: "timestamp"
    description: "System timestamp when row was written to Bronze Delta"
  _source_file:
    type: "string"
    description: "Origin source file URI"
  _batch_id:
    type: "string"
    description: "Unique ingestion batch run identifier"
  _source_system:
    type: "string"
    description: "Upstream system tag (e.g., ecommerce_csv)"
  _record_hash:
    type: "string"
    description: "SHA-256 fingerprint of business fields for lineage and replay"
