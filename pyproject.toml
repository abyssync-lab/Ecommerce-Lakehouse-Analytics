[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["SourceCode/metastore_db", "SourceCode/spark-warehouse"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E402", "E501"]

[tool.ruff.lint.per-file-ignores]
"SourceCode/SparkEcommerceAnalysis.py" = ["E741"]
