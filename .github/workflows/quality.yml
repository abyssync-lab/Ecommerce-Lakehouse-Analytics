name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: Fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check formatting
        run: python -m ruff format --check SourceCode tests scripts
      - name: Check lint
        run: python -m ruff check SourceCode tests scripts
      - name: Validate YAML contracts
        run: python scripts/validate_contracts.py
      - name: Run Python-only tests
        run: >-
          python -m pytest -q
          tests/test_advanced_analytics.py
          tests/test_analytics_contract.py
          tests/test_business_metrics.py
          tests/test_config.py
          tests/test_data_quality.py
          tests/test_edge_cases.py
          tests/test_environment_check.py
          tests/test_project_cli.py
          tests/test_pipeline_invariants.py::test_partial_incremental_shape_fails_before_bronze
          tests/test_pipeline_invariants.py::test_calculate_source_hash_idempotency
          tests/test_pipeline_invariants.py::test_source_hash_and_size_accept_file_uri
          tests/test_pipeline_invariants.py::test_pipeline_run_result_dataclass_contract

  spark-integration:
    name: Spark and Delta integration
    needs: fast-checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      SPARK_LOCAL_HOSTNAME: localhost
      HADOOP_USER_NAME: hadoop
      SPARK_IVY_DIR: ${{ runner.temp }}/globalcart-ivy2
      PYSPARK_PYTHON: python
      PYSPARK_DRIVER_PYTHON: python
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Set up Java for Spark
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run all tests without skipping integration coverage
        run: python -m pytest -q
      - name: Validate seed input
        run: python SourceCode/validate_input.py Data/EcommerceSalesDataset.csv
      - name: Build Gold serving snapshot
        run: python SourceCode/SparkEcommerceAnalysis.py --input Data/EcommerceSalesDataset.csv
      - name: Rebuild report from published Gold
        run: python SourceCode/build_business_report.py --source published
      - name: Run incremental pipeline end-to-end check
        run: python scripts/run_demo_pipeline.py
