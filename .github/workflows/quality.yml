name: Quality checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install pandas pytest ruff
      - name: Check syntax and common code issues
        run: ruff check SourceCode tests scripts
      - name: Run unit tests
        run: python -m pytest
      - name: Validate sample data contract
        run: python SourceCode/validate_input.py Data/EcommerceSalesDataset.csv
      - name: Rebuild portfolio business report
        run: python SourceCode/generate_portfolio_report.py
