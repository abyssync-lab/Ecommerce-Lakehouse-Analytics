name: Quality checks

on:
  push:
  pull_request:

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install fast-check dependencies
        run: python -m pip install "PyYAML>=6.0,<7.0" "ruff==0.16.6"
      - name: Check syntax and common code issues
        run: python -m ruff check SourceCode tests scripts
      - name: Check formatting of maintained pipeline code
        run: >-
          python -m ruff format --check
          SourceCode/lakehouse
          SourceCode/analytics_rules.py
          SourceCode/data_quality.py
          SourceCode/generate_portfolio_report.py
          SourceCode/portfolio_metrics.py
          SourceCode/SparkEcommerceAnalysis.py
          SourceCode/project_cli.py
          tests/test_current_state.py
          tests/test_portfolio_metrics.py
      - name: Validate YAML contracts
        run: python scripts/validate_contracts.py

  spark-integration:
    needs: fast-checks
    runs-on: ubuntu-latest
    env:
      ECOMMERCE_USE_LOCAL_STORAGE: "true"
      SPARK_LOCAL_IP: 127.0.0.1
      SPARK_LOCAL_HOSTNAME: localhost
      PYSPARK_PYTHON: python
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up Java for Spark
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Spark and Delta dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit and Spark integration tests
        run: python -m pytest
      - name: Validate sample data contract
        run: python SourceCode/validate_input.py Data/EcommerceSalesDataset.csv
      - name: Build certified Gold snapshot for report validation
        run: python SourceCode/SparkEcommerceAnalysis.py --input Data/EcommerceSalesDataset.csv
      - name: Rebuild portfolio business report
        run: python SourceCode/generate_portfolio_report.py --source published
