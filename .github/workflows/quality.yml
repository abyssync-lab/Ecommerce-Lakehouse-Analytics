name: Quality checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up Java for Spark
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install test and Spark dependencies
        run: python -m pip install -r requirements.txt ruff
      - name: Configure local Spark environment
        run: |
          echo "SPARK_LOCAL_IP=127.0.0.1" >> "$GITHUB_ENV"
          echo "PYSPARK_PYTHON=python" >> "$GITHUB_ENV"
      - name: Check syntax and common code issues
        run: ruff check SourceCode tests scripts
      - name: Run unit and Spark integration tests
        run: python -m pytest
      - name: Validate sample data contract
        run: python SourceCode/validate_input.py Data/EcommerceSalesDataset.csv
      - name: Build certified Gold snapshot for report validation
        run: python SourceCode/SparkEcommerceAnalysis.py --input Data/EcommerceSalesDataset.csv
      - name: Rebuild portfolio business report
        run: python SourceCode/generate_portfolio_report.py --source published
